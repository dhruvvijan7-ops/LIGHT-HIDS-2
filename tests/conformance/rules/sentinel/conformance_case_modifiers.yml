title: Sentinel Conformance - Case Sensitivity Modifiers
id: sentinel-conformance-cased-i
status: experimental
description: >
  Sentinel-authored conformance rule.  The SigmaHQ corpus at the pinned commit
  has almost no cased/i coverage, so both are exercised here: one selector is
  case-sensitive, the other case-insensitive (tests/conformance/ATTRIBUTION.md).
author: Sentinel
date: 2026/10/12
logsource:
  product: windows
  category: process_creation
  service: sysmon
detection:
  sel_cased:
    CommandLine|cased|contains: WhoAmI
  sel_insensitive:
    Image|i|contains: '\CMD.EXE'
  condition: sel_cased and sel_insensitive
falsepositives:
  - None intended; engine conformance only.
level: informational
tags:
  - conformance.t-c
