schema: sentinel-rule/v1
id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d2c
kind: fim
source: native
author: Sentinel content team
title: System32 Executable Hash Drift Against Uploaded Baseline
description: Requires an uploaded baseline pair (fim_baseline rows). Absent baseline = SNAPSHOT_MISSING,
  rule inert for the job, job COMPLETED_WITH_WARNINGS (cold-start policy 4.8) — never a silent pass.
severity: HIGH
fim:
  paths:
    include:
    - C:\\Windows\\System32\\*.exe
    exclude:
    - C:\\Windows\\System32\\*.log
  operations:
  - modify
  - attribute_change
  require:
    hash_changed: true
  baseline:
    source: upload_pair
enabled: true
compile:
  cost_class: standard
