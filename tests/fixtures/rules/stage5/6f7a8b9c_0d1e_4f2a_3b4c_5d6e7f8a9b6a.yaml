schema: sentinel-rule/v1
id: 6f7a8b9c-0d1e-4f2a-3b4c-5d6e7f8a9b6a
kind: statistical
source: native
author: Sentinel content team
title: First-Time Interactive User On Host
description: 'rare_value over authentication.account_name per host; a name absent from the 30d observed
  set is flagged. No ML (Stage-1 4.3): set-membership only.'
severity: LOW
statistical:
  kind: rare_value
  group_by:
  - host.agent_id
  measure:
    op: distinct_count
    field: authentication.account_name
  window:
    bucket: 1h
    span: 30d
  baseline:
    min_observations: 24
    warmup_action: flag
    estimator: none
  threshold:
    op: gte
    value: 1
  scope_filter:
    authentication.logon_type:
    - 2
    - 10
    - 11
enabled: true
compile:
  cost_class: window
