author: Sentinel content team
title: Repeated Failed Interactive Logons (Brute Force Candidate)
name: corr_bruteforce_failed_logons
description: More than 5 failed logon events for the same account on the same host within 10m. Referenced
  rules are ordinary kind:sigma rules resolved by name through the load-time name index; a missing/disabled
  member produces MEMBER_RULE_INACTIVE (never a silent no-op).
severity: HIGH
level_original: high
correlation:
  type: event_count
  rules:
  - win_auth_failure_4625
  - win_auth_failure_4768
  group-by:
  - authentication.account_name
  - host.agent_id
  timespan: 10m
  condition:
    gt: 5
  generate: true
enabled: true
compile:
  cost_class: window
